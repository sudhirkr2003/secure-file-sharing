# =========================
# PRODUCTION DATABASE
# =========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}


# =========================
# PRODUCTION FILE STORAGE
# =========================

storage.type=cloudinary

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# =========================
# PRODUCTION EMAIL - SENDGRID (HTTP API)
# =========================
# Uses SendGrid's Web API over HTTPS, not SMTP, because Render's free
# tier blocks outbound SMTP ports. Requires only a Single Sender
# Verification (one verified email address) - no domain needed.

sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.sender-email=${SENDGRID_SENDER_EMAIL}
sendgrid.sender-name=${SENDGRID_SENDER_NAME:SecureShare}


# =========================
# FRONTEND
# =========================

frontend.url=${FRONTEND_URL}


# =========================
# CLEANUP
# =========================

cleanup.fixed-delay-ms=${CLEANUP_FIXED_DELAY_MS:3600000}