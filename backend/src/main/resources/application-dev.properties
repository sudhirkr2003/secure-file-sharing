spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_file_sharing?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:local-development-secret-change-me}

mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

storage.type=${STORAGE_TYPE:local}

r2.endpoint=${R2_ENDPOINT:}
r2.region=${R2_REGION:auto}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:}

cleanup.fixed-delay-ms=${CLEANUP_FIXED_DELAY_MS:3600000}

frontend.url=${FRONTEND_URL:http://localhost:5173}